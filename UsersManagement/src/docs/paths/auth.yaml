/auth/login:
  post:
    summary: Iniciar sesión
    tags:
      - Autenticación
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components.yaml#/components/schemas/LoginRequest"
    responses:
      200:
        description: Token generado correctamente
        content:
          application/json:
            schema:
              $ref: "../components.yaml#/components/schemas/LoginResponse"
      401:
        $ref: "../components.yaml#/components/responses/UnauthorizedError"
